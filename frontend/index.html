    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      (() => {
        let stored = null;
        try { stored = localStorage.getItem("talentguard-theme"); } catch {}
        const theme = stored === "light" || stored === "dark" ? stored : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').setAttribute("content", theme === "dark" ? "#0a100d" : "#0d2f27");
      })();
    </script>
    <title>TalentGuard | Retention intelligence</title>
  </head>
  <body>
    <noscript>TalentGuard requires JavaScript for authenticated retention-review workflows.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
